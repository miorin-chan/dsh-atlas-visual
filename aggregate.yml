name: '@miorin/dsh-atlas-visual'
version: 0.1.0
private: false
description: 'Customize DeepSeek Harness appearance with a Claude-like skin, sidebar brand and account card tweaks, wider right sidebar layouts, and DeepSeek pricing hours.'
license: MIT
engines:
  dsh: '>=0.2.2-rc.5'
  node: '^22.18.0 || >=24.11.0'
plugins:
  - name: '@miorin/dsh-claudelike-ui'
    spec: 1.0.0
    enabled: true
  - name: '@miorin/dsh-hide-signed-in-card'
    spec: 0.1.0
    enabled: true
  - name: '@miorin/dsh-sidebar-brand'
    spec: 0.1.0
    enabled: true
  - name: '@miorin/dsh-aggressive-sidebar'
    spec: 0.1.0
    enabled: true
  - name: '@miorin/dsh-subtle-sidebar'
    spec: 0.1.0
    enabled: true
  - name: '@miorin/dsh-peak-pricing-sidebar'
    spec: 0.1.0
    enabled: true
